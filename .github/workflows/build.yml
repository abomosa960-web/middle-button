name: Build EXE

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download AutoHotkey v2 (official release)
        shell: pwsh
        run: |
          $rel = Invoke-RestMethod "https://api.github.com/repos/AutoHotkey/AutoHotkey/releases/latest"
          $asset = $rel.assets | Where-Object { $_.name -match '^AutoHotkey_2\.[\d\.]+\.zip$' } | Select-Object -First 1
          Write-Host "Downloading $($asset.name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile ahk.zip
          Expand-Archive ahk.zip -DestinationPath ahk

      - name: Compile to EXE
        shell: pwsh
        run: |
          $compiler = Get-ChildItem ahk -Recurse -Filter Ahk2Exe.exe | Select-Object -First 1
          $base = Get-ChildItem ahk -Recurse -Filter AutoHotkey64.exe | Where-Object { $_.FullName -notmatch 'Compiler' } | Select-Object -First 1
          if (-not $compiler) { Write-Error "Ahk2Exe.exe not found"; exit 1 }
          if (-not $base) { Write-Error "AutoHotkey64.exe not found"; exit 1 }
          Write-Host "Compiler: $($compiler.FullName)"
          Write-Host "Base: $($base.FullName)"
          & $compiler.FullName /in middle.ahk /out MiddleButton.exe /base $base.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path MiddleButton.exe)) { Write-Error "EXE was not created"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: MiddleButton
          path: MiddleButton.exe
