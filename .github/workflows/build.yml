name: Build EXE

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download AutoHotkey v2 and Ahk2Exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $h = @{ Authorization = "Bearer $env:GH_TOKEN" }
          $ahk = Invoke-RestMethod "https://api.github.com/repos/AutoHotkey/AutoHotkey/releases/latest" -Headers $h
          $a = $ahk.assets | Where-Object { $_.name -match '^AutoHotkey_2\.[\d\.]+\.zip$' } | Select-Object -First 1
          Write-Host "AHK: $($a.name)"
          Invoke-WebRequest $a.browser_download_url -OutFile ahk.zip
          Expand-Archive ahk.zip -DestinationPath ahk

          $cmp = Invoke-RestMethod "https://api.github.com/repos/AutoHotkey/Ahk2Exe/releases/latest" -Headers $h
          $c = $cmp.assets | Where-Object { $_.name -match '\.zip$' } | Select-Object -First 1
          Write-Host "Ahk2Exe: $($c.name)"
          Invoke-WebRequest $c.browser_download_url -OutFile ahk2exe.zip
          Expand-Archive ahk2exe.zip -DestinationPath ahk2exe

      - name: Compile to EXE
        shell: pwsh
        run: |
          $compiler = Get-ChildItem ahk2exe -Recurse -Filter Ahk2Exe.exe | Select-Object -First 1
          $base = Get-ChildItem ahk -Recurse -Filter AutoHotkey64.exe | Select-Object -First 1
          if (-not $compiler) { Write-Error "Ahk2Exe.exe not found"; exit 1 }
          if (-not $base) { Write-Error "AutoHotkey64.exe not found"; exit 1 }
          Write-Host "Compiler: $($compiler.FullName)"
          Write-Host "Base: $($base.FullName)"
          $p = Start-Process -FilePath $compiler.FullName -ArgumentList "/in `"$PWD\middle.ahk`" /out `"$PWD\MiddleButton.exe`" /base `"$($base.FullName)`" /silent verbose" -Wait -PassThru -NoNewWindow
          Write-Host "Ahk2Exe exit code: $($p.ExitCode)"
          if (-not (Test-Path MiddleButton.exe)) { Write-Error "EXE was not created"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: MiddleButton
          path: MiddleButton.exe
