name: Build EXE

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install AutoHotkey v2
        run: choco install autohotkey -y --no-progress

      - name: Compile to EXE
        shell: pwsh
        run: |
          $compiler = Get-ChildItem "C:\Program Files*\AutoHotkey" -Recurse -Filter Ahk2Exe.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          $base = Get-ChildItem "C:\Program Files*\AutoHotkey" -Recurse -Filter AutoHotkey64.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\v2\\' } | Select-Object -First 1
          if (-not $compiler) { Write-Error "Ahk2Exe.exe not found"; Get-ChildItem "C:\Program Files*\AutoHotkey" -Recurse | Select-Object FullName; exit 1 }
          if (-not $base) { Write-Error "AutoHotkey v2 base not found"; exit 1 }
          Write-Host "Compiler: $($compiler.FullName)"
          Write-Host "Base: $($base.FullName)"
          & $compiler.FullName /in middle.ahk /out MiddleButton.exe /base $base.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: MiddleButton
          path: MiddleButton.exe
